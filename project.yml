name: MeetingRecorder
options:
  bundleIdPrefix: com.daltonrooney
  deploymentTarget:
    macOS: "14.2"
  developmentLanguage: en


settings:
  base:
    PRODUCT_NAME: MeetingRecorder
    PRODUCT_BUNDLE_IDENTIFIER: com.daltonrooney.MeetingRecorder
    MACOSX_DEPLOYMENT_TARGET: "14.2"
    SWIFT_VERSION: "6.0"
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: MeetingRecorder/Info.plist
    CODE_SIGN_ENTITLEMENTS: MeetingRecorder/MeetingRecorder.entitlements
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  MeetingRecorder:
    type: application
    platform: macOS
    sources:
      - path: MeetingRecorder
        excludes:
          - "*.plist"
          - "*.entitlements"
    info:
      path: MeetingRecorder/Info.plist
    entitlements:
      path: MeetingRecorder/MeetingRecorder.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daltonrooney.MeetingRecorder
        INFOPLIST_FILE: MeetingRecorder/Info.plist
        CODE_SIGN_ENTITLEMENTS: MeetingRecorder/MeetingRecorder.entitlements
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          GCC_OPTIMIZATION_LEVEL: "0"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          GCC_OPTIMIZATION_LEVEL: "s"

  MeetingRecorderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MeetingRecorderTests
    dependencies:
      - target: MeetingRecorder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daltonrooney.MeetingRecorderTests
        INFOPLIST_FILE: MeetingRecorderTests/Info.plist
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  MeetingRecorder:
    build:
      targets:
        MeetingRecorder: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: MeetingRecorderTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
