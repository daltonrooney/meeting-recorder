name: Olive
options:
  bundleIdPrefix: dev.rygn
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en


settings:
  base:
    PRODUCT_NAME: Olive
    PRODUCT_BUNDLE_IDENTIFIER: dev.rygn.Olive
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: CallTranscription/Info.plist
    CODE_SIGN_ENTITLEMENTS: CallTranscription/CallTranscription.entitlements
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  CallTranscription:
    type: application
    platform: macOS
    sources:
      - path: CallTranscription
        excludes:
          - "*.plist"
          - "*.entitlements"
    info:
      path: CallTranscription/Info.plist
    entitlements:
      path: CallTranscription/CallTranscription.entitlements
    preBuildScripts:
      - name: Validate Configuration
        script: |
          # Validate project configuration before build
          "${PROJECT_DIR}/scripts/validate-configuration.swift"
        showEnvVars: false
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rygn.Olive
        PRODUCT_MODULE_NAME: CallTranscription
        INFOPLIST_FILE: CallTranscription/Info.plist
        CODE_SIGN_ENTITLEMENTS: CallTranscription/CallTranscription.entitlements
        DEFINES_MODULE: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          GCC_OPTIMIZATION_LEVEL: "0"
          ONLY_ACTIVE_ARCH: YES
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          GCC_OPTIMIZATION_LEVEL: "s"

  CallTranscriptionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CallTranscriptionTests
    dependencies:
      - target: CallTranscription
    entitlements:
      path: CallTranscriptionTests/CallTranscriptionTests.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rygn.CallTranscriptionTests
        PRODUCT_MODULE_NAME: CallTranscriptionTests
        CODE_SIGN_ENTITLEMENTS: CallTranscriptionTests/CallTranscriptionTests.entitlements
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Olive.app/Contents/MacOS/Olive"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          ONLY_ACTIVE_ARCH: YES
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  Olive:
    build:
      targets:
        CallTranscription: all
        CallTranscriptionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: CallTranscriptionTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
