name: MeetingRecorder
options:
  bundleIdPrefix: com.daltonrooney
  deploymentTarget:
    macOS: "14.2"
  developmentLanguage: en


settings:
  base:
    PRODUCT_NAME: MeetingRecorder
    PRODUCT_BUNDLE_IDENTIFIER: com.daltonrooney.MeetingRecorder
    MACOSX_DEPLOYMENT_TARGET: "14.2"
    SWIFT_VERSION: "6.0"
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: MeetingRecorder/Info.plist
    CODE_SIGN_ENTITLEMENTS: MeetingRecorder/MeetingRecorder.entitlements
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  MeetingRecorder:
    type: application
    platform: macOS
    sources:
      - path: MeetingRecorder
        excludes:
          - "*.plist"
          - "*.entitlements"
    info:
      path: MeetingRecorder/Info.plist
    entitlements:
      path: MeetingRecorder/MeetingRecorder.entitlements
    preBuildScripts:
      - name: Validate Configuration
        script: |
          # Validate project configuration before build
          "${PROJECT_DIR}/scripts/validate-configuration.swift"
        showEnvVars: false
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daltonrooney.MeetingRecorder
        PRODUCT_MODULE_NAME: MeetingRecorder
        INFOPLIST_FILE: MeetingRecorder/Info.plist
        CODE_SIGN_ENTITLEMENTS: MeetingRecorder/MeetingRecorder.entitlements
        DEFINES_MODULE: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          GCC_OPTIMIZATION_LEVEL: "0"
          ONLY_ACTIVE_ARCH: YES
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          GCC_OPTIMIZATION_LEVEL: "s"

  MeetingRecorderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MeetingRecorderTests
    dependencies:
      - target: MeetingRecorder
    entitlements:
      path: MeetingRecorderTests/MeetingRecorderTests.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daltonrooney.MeetingRecorderTests
        PRODUCT_MODULE_NAME: MeetingRecorderTests
        CODE_SIGN_ENTITLEMENTS: MeetingRecorderTests/MeetingRecorderTests.entitlements
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          ONLY_ACTIVE_ARCH: YES
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  MeetingRecorder:
    build:
      targets:
        MeetingRecorder: all
        MeetingRecorderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: MeetingRecorderTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
